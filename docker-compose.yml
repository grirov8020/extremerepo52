version: '3.8'

services:
  strix-web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - STRIX_LLM=anthropic/claude-sonnet-4-20250514
      - PORT=8080
      - DEBUG=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # For Strix Docker sandbox
      - ./tmp:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
